# Versionen geprüft am 01.11.2026 gegen Maven Central / Google Maven (jeweils neueste stabile).
# AGP 9.5 braucht mindestens Gradle 9.6 (hier: Wrapper 9.8.2).
# AGP 9 bringt Kotlin eingebaut mit ("built-in Kotlin") – das Plugin
# org.jetbrains.kotlin.android wird deshalb NICHT angewendet.

[versions]
agp = "9.5.0"
kotlin = "2.4.21"
ksp = "2.3.13"
desugar = "2.1.5"

compose-bom = "2026.09.00"
activity = "1.13.0"
geckoview = "159.0.20261022150525"
appcompat = "1.8.0"
core-ktx = "1.19.1"
fragment = "1.9.1"
lifecycle = "2.11.0"
room = "2.8.5"
datastore = "1.3.0"
coroutines = "1.11.0"

readium = "3.4.0"

[libraries]
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }

activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
geckoview = { module = "org.mozilla.geckoview:geckoview", version.ref = "geckoview" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }

room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

readium-shared = { module = "org.readium.kotlin-toolkit:readium-shared", version.ref = "readium" }
readium-streamer = { module = "org.readium.kotlin-toolkit:readium-streamer", version.ref = "readium" }
readium-navigator = { module = "org.readium.kotlin-toolkit:readium-navigator", version.ref = "readium" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
