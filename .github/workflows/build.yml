name: APK bauen

on:
  push:
    branches: [main, dev]
    # Reine Doku-Aenderungen erzeugen keine neue App-Version.
    paths-ignore:
      - "**.md"
      - ".doku/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # noetig, um das GitHub-Release mit der APK anzulegen

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # dev  → Vorschau-App "Self Dev" (Pre-Release, eigene App neben der normalen)
    # main → normale App "Self"
    env:
      SELF_CHANNEL: ${{ github.ref == 'refs/heads/dev' && 'dev' || 'stable' }}
      APK_NAME: ${{ github.ref == 'refs/heads/dev' && 'self-dev' || 'self' }}-0.1.${{ github.run_number }}

    steps:
      - name: Code holen
        uses: actions/checkout@v7

      - name: Java 21 einrichten
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Prueft ausserdem, dass gradle-wrapper.jar ein offizielles Gradle-Jar ist.
      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v6

      - name: Signatur-Schluessel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.SELF_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SELF_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SELF_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/self-release.p12"
            {
              echo "SELF_KEYSTORE_PATH=$RUNNER_TEMP/self-release.p12"
              echo "SELF_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "SELF_KEY_ALIAS=$KEY_ALIAS"
            } >> "$GITHUB_ENV"
            echo "Fester Release-Schluessel wird verwendet."
          else
            echo "::warning::Kein Release-Schluessel hinterlegt – APK wird mit Debug-Schluessel signiert (Updates nicht moeglich)."
          fi

      - name: APK bauen
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: APK umbenennen
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/$APK_NAME.apk"
          ls -l out

      - name: APK als Artifact hochladen
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_NAME }}
          path: out/*.apk
          if-no-files-found: error

      # Obtainium holt sich die Updates aus den Releases.
      - name: GitHub-Release anlegen (Self)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          gh release create "v0.1.${{ github.run_number }}" out/*.apk \
            --title "Self 0.1.${{ github.run_number }}" \
            --notes "Automatischer Build von ${GITHUB_SHA::7}: ${COMMIT_MSG%%$'\n'*}" \
            --target "$GITHUB_SHA"

      - name: Vorschau-Release anlegen (Self Dev)
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          gh release create "v0.1.${{ github.run_number }}-dev" out/*.apk \
            --prerelease \
            --title "Self Dev 0.1.${{ github.run_number }}" \
            --notes "Vorschau von ${GITHUB_SHA::7}: ${COMMIT_MSG%%$'\n'*}" \
            --target "$GITHUB_SHA"
          # Nur die 5 neuesten Vorschau-Releases behalten.
          gh release list --limit 100 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease) | .tagName' \
            | tail -n +6 \
            | while read -r tag; do gh release delete "$tag" --yes --cleanup-tag; done
